name: Set up SymCrypt
description: >-
  Installs a pinned, checksum-verified build of the native SymCrypt library so that the `symcrypt`
  crate can link against it and load it at runtime. Supports Ubuntu 22.04/24.04 (x64 and arm64)
  and Windows (x64 and arm64) runners.

# Linux: installs the `symcrypt` package that packages.microsoft.com (PMC) publishes for Ubuntu,
# which is how the symcrypt crate documents installing SymCrypt on Ubuntu (rust-symcrypt README
# and INSTALL.md). PMC has the package for both amd64 and arm64. Instead of configuring the apt
# repository and running `apt-get update`, the pinned .deb is downloaded straight from the PMC pool
# and its SHA-256 is checked, which pins the exact build and skips the slow apt index refresh. The
# result is the same as `apt-get install symcrypt`: the library lands in the standard linker and
# loader path (/usr/lib/<multiarch>), so SYMCRYPT_LIB_PATH and LD_LIBRARY_PATH are not needed and
# are left unset, as INSTALL.md recommends for packaged installs.
#
# Windows: downloads the official release archive from github.com/microsoft/SymCrypt, checks its
# SHA-256, extracts symcrypt.lib and symcrypt.dll, sets SYMCRYPT_LIB_PATH (the directory with
# symcrypt.lib, required by the symcrypt-sys build script on Windows) and SYMCRYPT_DLL (the full path
# of symcrypt.dll), and prepends the directory to PATH.
#
# Windows looks for a DLL in the executable's directory and in System32 before PATH, and some images
# (including windows-latest, Windows Server 2025) have their own symcrypt.dll in System32: an OS
# component whose version varies by image. To make executables load the pinned DLL, which matches
# the symcrypt.lib they link against, every Windows job that runs symcrypt-linked executables must
# list their directories in `copy-dll-to`. The directories are created if needed, so the copy can
# happen before `cargo build` or `cargo test`:
#   - `target/debug/deps` for `cargo test` (unit and integration test executables)
#   - `target/debug/examples` for examples, `target/debug` for `cargo run`
#   - adjust the paths for `--release` (target/release/...), `--target` (target/<triple>/...) or
#     CARGO_TARGET_DIR
# Doctests are compiled into temporary directories, so they still resolve symcrypt.dll through
# System32 or PATH: Windows jobs should skip them (e.g. `cargo test --all-targets`) or accept that.
# To copy the DLL somewhere else by hand, use $env:SYMCRYPT_DLL. Without `copy-dll-to`, the action
# prints a notice when a System32 copy exists. Example:
#
#   - uses: ./.github/actions/setup-symcrypt
#     with:
#       copy-dll-to: target/debug/deps  # ignored on Linux
#
# Using the action again in the same job is a no-op apart from re-exporting the environment.
#
# To add a version, append its checksums to both tables below. PMC package checksums are in
# https://packages.microsoft.com/ubuntu/24.04/prod/dists/noble/main/binary-<arch>/Packages
# (the 22.04 pool serves identical files); release archive checksums are listed by
# `gh release view v<version> -R microsoft/SymCrypt --json assets`.

inputs:
  version:
    description: >-
      SymCrypt version to install. symcrypt 0.6 needs 103.8.0 or newer. The version must have
      checksums in this action (currently 103.11.0, the newest version PMC publishes for Ubuntu).
    required: false
    default: "103.11.0"
  copy-dll-to:
    description: >-
      Windows only: newline-separated directories, relative to the workspace or absolute, to copy
      the provisioned symcrypt.dll into, so that executables there load it rather than a System32
      copy (`target/debug/deps` for `cargo test`). Missing directories are created. Ignored on
      Linux, where executables always load the packaged library.
    required: false
    default: ""

outputs:
  version:
    description: The installed SymCrypt version.
    value: ${{ inputs.version }}
  lib-dir:
    description: >-
      Directory that holds the link-time library (libsymcrypt.so on Linux, symcrypt.lib and
      symcrypt.dll on Windows).
    value: ${{ steps.linux.outputs.lib-dir || steps.windows.outputs.lib-dir }}

runs:
  using: composite
  steps:
    - name: Install SymCrypt from packages.microsoft.com (Linux)
      id: linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        SYMCRYPT_VERSION: ${{ inputs.version }}
        SYMCRYPT_COPY_DLL_TO: ${{ inputs.copy-dll-to }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=setup-symcrypt::$*"; exit 1; }

        version="$SYMCRYPT_VERSION"
        case "$RUNNER_ARCH" in
          X64) arch=amd64 multiarch=x86_64-linux-gnu ;;
          ARM64) arch=arm64 multiarch=aarch64-linux-gnu ;;
          *) fail "unsupported Linux runner architecture '$RUNNER_ARCH' (supported: X64, ARM64)" ;;
        esac

        # SHA-256 of symcrypt_<version>-1_<arch>.deb on PMC.
        case "$version/$arch" in
          103.11.0/amd64) sha256=ba6a4b4718ab2a231d76dd20ade0f92370beea2db83095359e93cd0fdc0ae36a ;;
          103.11.0/arm64) sha256=bf7f4164ac59bc1d20ee51f2b0ad59f8aa71c85ae1b3455567e206a722f1b406 ;;
          *) fail "no pinned checksum for SymCrypt '$version' on linux/$arch; add one to .github/actions/setup-symcrypt/action.yml" ;;
        esac

        . /etc/os-release
        case "${ID:-}/${VERSION_ID:-}" in
          ubuntu/22.04 | ubuntu/24.04) ;;
          *) fail "unsupported distribution '${PRETTY_NAME:-unknown}'; PMC publishes symcrypt for Ubuntu 22.04 and 24.04" ;;
        esac

        sudo=sudo
        if [ "$(id -u)" -eq 0 ]; then sudo=; fi

        if [ "$(dpkg-query -W -f='${Version}' symcrypt 2>/dev/null || true)" = "$version-1" ]; then
          echo "SymCrypt $version is already installed"
        else
          deb="symcrypt_${version}-1_${arch}.deb"
          url="https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod/pool/main/s/symcrypt/$deb"
          echo "Downloading $url"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$deb" "$url"
          echo "$sha256  $RUNNER_TEMP/$deb" | sha256sum --check --strict -
          $sudo dpkg --install "$RUNNER_TEMP/$deb"
          $sudo ldconfig
          rm -f "$RUNNER_TEMP/$deb"
        fi

        lib_dir="/usr/lib/$multiarch"
        installed="$(dpkg-query -W -f='${Version}' symcrypt)"
        [ "$installed" = "$version-1" ] || fail "dpkg reports symcrypt $installed, expected $version-1"
        target="$(readlink -f "$lib_dir/libsymcrypt.so")"
        [ "$target" = "$lib_dir/libsymcrypt.so.$version" ] \
          || fail "$lib_dir/libsymcrypt.so resolves to '$target', expected $lib_dir/libsymcrypt.so.$version"
        # The cache may list the library under /lib/<multiarch> (a symlink to /usr/lib on merged-/usr
        # systems), so compare files rather than paths.
        soname="libsymcrypt.so.${version%%.*}"
        loader_cache="$(ldconfig -p)"
        cached=
        while read -r path; do
          if [ "$path" -ef "$lib_dir/$soname" ]; then cached="$path"; fi
        done < <(awk -v soname="$soname" '$1 == soname { print $NF }' <<<"$loader_cache")
        [ -n "$cached" ] || fail "the runtime loader cache has no entry for $lib_dir/$soname"

        echo "lib-dir=$lib_dir" >> "$GITHUB_OUTPUT"
        echo "SymCrypt $version: $target (loader cache: $cached)"
        if [ -n "${SYMCRYPT_COPY_DLL_TO//[[:space:]]/}" ]; then
          echo "copy-dll-to is ignored on Linux: executables load libsymcrypt.so from $lib_dir"
        fi

    - name: Install SymCrypt release archive (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SYMCRYPT_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        function Fail([string] $message) {
          Write-Output "::error title=setup-symcrypt::$message"
          exit 1
        }

        $version = $env:SYMCRYPT_VERSION
        $arch = switch ($env:RUNNER_ARCH) { 'X64' { 'amd64' } 'ARM64' { 'arm64' } }
        if (-not $arch) { Fail "unsupported Windows runner architecture '$env:RUNNER_ARCH' (supported: X64, ARM64)" }

        # Release asset name and SHA-256 (matches the digest GitHub lists for the asset).
        $pinned = @{
          '103.11.0/amd64' = 'symcrypt-windows-amd64-release-103.11.0-748c20f1.zip', '5e2a9e60c03a60b952e84a3b50984f0d723a4b3ec1585f9cf6e800d4bd61159e'
          '103.11.0/arm64' = 'symcrypt-windows-arm64-release-103.11.0-748c20f1.zip', 'a947fb36ddfdeb9c92dddcf657f6cfd755cbb1aaace01d61e2157e6bbe685b8d'
        }
        if (-not $pinned.ContainsKey("$version/$arch")) {
          Fail "no pinned checksum for SymCrypt '$version' on windows/$arch; add one to .github/actions/setup-symcrypt/action.yml"
        }
        $asset, $sha256 = $pinned["$version/$arch"]

        $root = Join-Path $env:RUNNER_TEMP "symcrypt-$version-windows-$arch"
        $libDir = Join-Path $root 'dll'
        $marker = Join-Path $root 'archive.sha256'
        $files = 'symcrypt.lib', 'symcrypt.dll'
        $complete = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $sha256) -and
          -not ($files | Where-Object { -not (Test-Path (Join-Path $libDir $_)) })

        if ($complete) {
          Write-Output "SymCrypt $version is already installed in $libDir"
        } else {
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/microsoft/SymCrypt/releases/download/v$version/$asset"
          Write-Output "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 5
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) { Fail "checksum mismatch for ${asset}: expected $sha256, got $actual" }

          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($file in $files) {
              $entry = $archive.GetEntry("dll/$file")
              if (-not $entry) { Fail "$asset has no dll/$file" }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $libDir $file), $true)
            }
          } finally {
            $archive.Dispose()
          }
          Set-Content -Path $marker -Value $sha256
          Remove-Item $zip
        }

        $dll = Join-Path $libDir 'symcrypt.dll'
        $info = (Get-Item $dll).VersionInfo
        $dllVersion = '{0}.{1}.{2}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart
        if ($dllVersion -ne $version) { Fail "symcrypt.dll reports version $dllVersion, expected $version" }

        "SYMCRYPT_LIB_PATH=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SYMCRYPT_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $libDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "lib-dir=$libDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Output "SymCrypt $version ($($info.FileVersion)): $libDir"

    - name: Check SymCrypt runtime lookup (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SYMCRYPT_EXPECTED_DIR: ${{ steps.windows.outputs.lib-dir }}
        SYMCRYPT_VERSION: ${{ inputs.version }}
        SYMCRYPT_COPY_DLL_TO: ${{ inputs.copy-dll-to }}
      run: |
        $ErrorActionPreference = 'Stop'
        $expected = $env:SYMCRYPT_EXPECTED_DIR
        $expectedDll = Join-Path $expected 'symcrypt.dll'
        if ($env:SYMCRYPT_LIB_PATH -ne $expected) {
          Write-Output "::error title=setup-symcrypt::SYMCRYPT_LIB_PATH is '$env:SYMCRYPT_LIB_PATH', expected '$expected'"
          exit 1
        }
        if ($env:SYMCRYPT_DLL -ne $expectedDll) {
          Write-Output "::error title=setup-symcrypt::SYMCRYPT_DLL is '$env:SYMCRYPT_DLL', expected '$expectedDll'"
          exit 1
        }
        $found = $env:PATH -split ';' | Where-Object { $_ -and (Test-Path (Join-Path $_ 'symcrypt.dll')) } | Select-Object -First 1
        if ($found -ne $expected) {
          Write-Output "::error title=setup-symcrypt::the first symcrypt.dll on PATH is in '$found', expected '$expected'"
          exit 1
        }
        # Windows searches the executable's directory and System32 before PATH.
        $system = Join-Path ([Environment]::SystemDirectory) 'symcrypt.dll'
        if ((Test-Path $system) -and [string]::IsNullOrWhiteSpace($env:SYMCRYPT_COPY_DLL_TO)) {
          $systemVersion = (Get-Item $system).VersionInfo.FileVersion
          Write-Output "::notice title=setup-symcrypt::Windows loads $system ($systemVersion) before the pinned SymCrypt $env:SYMCRYPT_VERSION on PATH. List the executables' directories in the copy-dll-to input (target/debug/deps for cargo test) to load the pinned DLL, or copy $expectedDll (`$env:SYMCRYPT_DLL) next to them."
        }
        Write-Output "symcrypt.dll resolves from PATH to $found"

    - name: Copy symcrypt.dll next to executables (Windows)
      if: runner.os == 'Windows' && inputs.copy-dll-to != ''
      shell: pwsh
      env:
        SYMCRYPT_LIB_DIR: ${{ steps.windows.outputs.lib-dir }}
        SYMCRYPT_COPY_DLL_TO: ${{ inputs.copy-dll-to }}
      run: |
        $ErrorActionPreference = 'Stop'
        $dll = Join-Path $env:SYMCRYPT_LIB_DIR 'symcrypt.dll'
        $dllVersion = (Get-Item $dll).VersionInfo.FileVersion
        foreach ($entry in $env:SYMCRYPT_COPY_DLL_TO -split '\r?\n') {
          if ([string]::IsNullOrWhiteSpace($entry)) { continue }
          $dir = [System.IO.Path]::GetFullPath($entry.Trim(), $env:GITHUB_WORKSPACE)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $dir 'symcrypt.dll') -Force
          Write-Output "Copied $dll ($dllVersion) to $dir"
        }

    - name: Reject unsupported runner
      if: runner.os != 'Linux' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "::error title=setup-symcrypt::unsupported runner OS '$RUNNER_OS' (supported: Linux, Windows)"
        exit 1
