name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# `--all-features` includes the `symcrypt` backend, so the steps that use it are preceded by
# setup-symcrypt, which provides the native SymCrypt library (and SYMCRYPT_LIB_PATH, which the
# symcrypt-sys build script requires on Windows). A Windows job that runs symcrypt-linked
# executables must also pass `copy-dll-to` (see .github/actions/setup-symcrypt/action.yml).
jobs:
  Build:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Build (no features enabled)
        run: cargo build --verbose

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Build (all features enabled)
        run: cargo build --verbose --all-features

  Build-Windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: install nasm
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (no features enabled)
        run: cargo build --verbose

      # Its CNG calls only run on Windows.
      - name: Test pageant
        run: cargo test -p pageant

      # symcrypt.yml tests russh on Windows with the symcrypt backend; cover the default
      # (aws-lc-rs) and ring backends here. The OpenSSH interop tests skip themselves when sshd
      # isn't available.
      - name: Test russh (default features)
        run: cargo test --verbose -p russh

      - name: Test russh (ring)
        run: cargo test --verbose -p russh --no-default-features --features ring,rsa,flate2,secure-algorithms

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Build (all features enabled)
        run: cargo build --verbose --all-features

  Build-WASM:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates clang curl git

      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Install target
        run: |
          rustup toolchain add 1.89.0
          rustup target add --toolchain 1.89.0 wasm32-wasip1

      - name: Build (WASM-compatible features)
        run: cargo +1.89.0 build --verbose --target wasm32-wasip1 --no-default-features --features flate2,ring,secure-algorithms -p russh

  Formatting:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: rustfmt
        run: cargo fmt --check

      # russh's lib.rs pulls in the rest of the crate with `include!("lib_inner.rs")`, which rustfmt
      # doesn't follow, so `cargo fmt` never reaches lib_inner.rs or the modules it declares. Check
      # them directly; this runs even if the step above failed, so that one run reports both.
      - name: rustfmt (russh/src/lib_inner.rs and its modules)
        if: ${{ !cancelled() }}
        run: |
          rustfmt --edition 2024 --check russh/src/lib_inner.rs || {
            echo "::error::cargo fmt doesn't reach the modules declared in russh/src/lib_inner.rs; format them with \`rustfmt --edition 2024 russh/src/lib_inner.rs\`"
            exit 1
          }

      - name: Check formatting (ci crates)
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --manifest-path ci/symcrypt-smoke/Cargo.toml --check
          cargo fmt --manifest-path ci/symcrypt-consumer/Cargo.toml --check

  Clippy:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy (no features enabled)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (aws-lc-rs)
        run: cargo clippy -p russh --all-targets --no-default-features --features aws-lc-rs,secure-algorithms -- -D warnings

      - name: Clippy (ring)
        run: cargo clippy -p russh --all-targets --no-default-features --features ring,secure-algorithms -- -D warnings

      - name: Clippy (ring, rsa)
        run: cargo clippy -p russh --all-targets --no-default-features --features ring,rsa,secure-algorithms -- -D warnings

      # A build with only a few algorithm features.
      - name: Clippy (aws-lc-rs, a few algorithms)
        run: cargo clippy -p russh --all-targets --no-default-features --features aws-lc-rs,mlkem1024nistp384-sha384,mlkem768nistp256-sha256,ecdh-sha2-nistp384,aes256-gcm,aes256-ctr,hmac-sha2-512-etm -- -D warnings

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Clippy (all features enabled)
        run: cargo clippy --all-targets --all-features -- -D warnings

  Test:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git openssh-client openssh-server pkg-config
          mkdir -p /run/sshd

      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Test (no features enabled)
        run: |
          eval `ssh-agent`
          cargo test --verbose -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Test (all features enabled)
        run: |
          eval `ssh-agent`
          cargo test --verbose --all-features -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

  # russh's tests with each crypto backend, against the OpenSSH 10.2 of Ubuntu 26.04 rather than the
  # 9.6 of the 24.04 jobs: the interop checks that need OpenSSH 9.9 or later (mlkem768x25519-sha256)
  # run only here. Each backend is tested with the default algorithms (`secure-algorithms`), with
  # all of them (`all-algorithms`), and with only a few (the ML-KEM hybrids with the NIST curves and
  # ECDH on P-384, AES-256 and HMAC-SHA-512-EtM): the cases of disabled algorithms are skipped, and
  # `russh/tests/algorithm_features.rs` checks that they are refused. `ring` without `rsa` checks
  # that the tests that use RSA keys are gated on it, and `symcrypt` with every opt-in feature that
  # the tests still pass with the features compiled in (the symcrypt backend never uses them for
  # protocol crypto). `symcrypt,ed25519-aws-lc` runs the Ed25519 interop checks against this OpenSSH
  # too. One job per feature set, in parallel, to keep the workflow's wall time down.
  Test-features:
    name: Test (${{ matrix.features }}, OpenSSH 10)
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - default,all-algorithms
          - aws-lc-rs,mlkem1024nistp384-sha384,mlkem768nistp256-sha256,ecdh-sha2-nistp384,aes256-gcm,aes256-ctr,hmac-sha2-512-etm
          - ring,secure-algorithms
          - ring,rsa,all-algorithms
          - symcrypt,secure-algorithms
          - symcrypt,ed25519-aws-lc,mlkem1024nistp384-sha384,mlkem768nistp256-sha256,ecdh-sha2-nistp384,aes256-gcm,aes256-ctr,hmac-sha2-512-etm
          - symcrypt,rsa,des,dsa,flate2,serde,async-trait,all-algorithms
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:26.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git openssh-client openssh-server pkg-config
          mkdir -p /run/sshd

      # The harness skips, even with RUSSH_REQUIRE_SSHD, the checks the installed OpenSSH can't do.
      - name: Check that OpenSSH supports mlkem768x25519-sha256
        run: |
          ssh -V
          ssh -Q kex | grep -qx mlkem768x25519-sha256 || { echo "::error::this OpenSSH has no mlkem768x25519-sha256"; exit 1; }

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Set up SymCrypt
        if: contains(matrix.features, 'symcrypt')
        uses: ./.github/actions/setup-symcrypt

      - name: Test
        run: cargo test -p russh --no-default-features --features "$FEATURES"
        env:
          FEATURES: ${{ matrix.features }}
          RUST_BACKTRACE: 1
          # Fail rather than skip the OpenSSH interop checks if sshd can't be started.
          RUSSH_REQUIRE_SSHD: "1"

  Minimal-versions:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

    steps:
      - name: Install job dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Check with minimal dependency versions
        run: |
          cargo minimal-versions check --all-features --no-dev-deps
