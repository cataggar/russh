name: SymCrypt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: SymCrypt smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ubuntu:24.04
          - os: ubuntu-24.04-arm
            container: ubuntu:24.04
          - os: windows-latest
    runs-on: ${{ (startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.os == 'ubuntu-24.04-arm' && 'ARM64' || 'X64'))) || matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Linux job dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v4

      - name: Isolate Linux Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.91.0
        if: runner.os == 'Linux'

      # The smoke crate is its own workspace, so its executable is built in ci/symcrypt-smoke/target.
      - name: Set up SymCrypt
        id: symcrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      # A second run must be a no-op that leaves the same environment behind.
      - name: Set up SymCrypt again
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      - name: Show SymCrypt location
        shell: bash
        env:
          SYMCRYPT_VERSION: ${{ steps.symcrypt.outputs.version }}
          SYMCRYPT_LIB_DIR: ${{ steps.symcrypt.outputs.lib-dir }}
        run: |
          echo "SymCrypt $SYMCRYPT_VERSION in $SYMCRYPT_LIB_DIR"
          dir="$SYMCRYPT_LIB_DIR"
          if command -v cygpath > /dev/null; then dir="$(cygpath --unix "$dir")"; fi
          ls -l "$dir"/*symcrypt*

      - name: Run the SymCrypt smoke test
        run: cargo run --manifest-path ci/symcrypt-smoke/Cargo.toml
        env:
          RUST_BACKTRACE: 1
          # The loader must pick the provisioned library: the packaged one on Linux, and on Windows the
          # copy next to the executable rather than C:\Windows\System32\symcrypt.dll.
          SYMCRYPT_SMOKE_EXPECTED_LIBRARY: ${{ runner.os == 'Windows' && format('{0}\ci\symcrypt-smoke\target\debug\symcrypt.dll', github.workspace) || format('{0}/libsymcrypt.so.{1}', steps.symcrypt.outputs.lib-dir, steps.symcrypt.outputs.version) }}

  # russh with SymCrypt as its only crypto backend. The test filters pick up new tests without
  # editing this workflow: unit tests under `crypto::symcrypt` (russh/src/crypto/symcrypt/) and
  # integration tests named russh/tests/symcrypt_*.rs.
  russh-symcrypt-only:
    name: russh (symcrypt only, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ubuntu:24.04
          - os: ubuntu-24.04-arm
            container: ubuntu:24.04
          - os: windows-latest
    runs-on: ${{ (startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.os == 'ubuntu-24.04-arm' && 'ARM64' || 'X64'))) || matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Linux job dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git openssh-client openssh-server pkg-config
          mkdir -p /run/sshd

      - uses: actions/checkout@v4

      - name: Isolate Linux Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.91.0
        if: runner.os == 'Linux'

      # On Windows, put the pinned symcrypt.dll next to the test executables so
      # they load it instead of C:\Windows\System32\symcrypt.dll.
      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: target/debug/deps

      - name: Build
        run: cargo build -p russh --no-default-features --features symcrypt

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy -p russh --no-default-features --features symcrypt -- -D warnings

      - name: Check the cipher benchmarks
        run: cargo check -p russh --no-default-features --features symcrypt,_bench --bench ciphers

      - name: Unit tests (crypto::symcrypt)
        run: cargo test -p russh --no-default-features --features symcrypt --lib -- crypto::symcrypt
        env:
          RUST_BACKTRACE: 1

      - name: Integration tests (tests/symcrypt_*.rs)
        run: cargo test -p russh --no-default-features --features symcrypt --test 'symcrypt_*'
        env:
          RUST_BACKTRACE: 1
          # Fail rather than skip the OpenSSH interop checks if sshd can't be
          # started. The harness needs a Unix sshd, so Windows only skips them.
          RUSSH_REQUIRE_SSHD: ${{ runner.os == 'Linux' && '1' || '0' }}
