name: SymCrypt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: SymCrypt smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SymCrypt
        id: symcrypt
        uses: ./.github/actions/setup-symcrypt

      # A second run must be a no-op that leaves the same environment behind.
      - name: Set up SymCrypt again
        uses: ./.github/actions/setup-symcrypt

      - name: Show SymCrypt location
        shell: bash
        env:
          SYMCRYPT_VERSION: ${{ steps.symcrypt.outputs.version }}
          SYMCRYPT_LIB_DIR: ${{ steps.symcrypt.outputs.lib-dir }}
        run: |
          echo "SymCrypt $SYMCRYPT_VERSION in $SYMCRYPT_LIB_DIR"
          dir="$SYMCRYPT_LIB_DIR"
          if command -v cygpath > /dev/null; then dir="$(cygpath --unix "$dir")"; fi
          ls -l "$dir"/*symcrypt*

      - name: Run the SymCrypt smoke test
        run: cargo run --manifest-path ci/symcrypt-smoke/Cargo.toml
        env:
          RUST_BACKTRACE: 1
          # On Linux the loader must pick the packaged library.
          SYMCRYPT_SMOKE_EXPECTED_LIBRARY: ${{ runner.os == 'Linux' && format('{0}/libsymcrypt.so.{1}', steps.symcrypt.outputs.lib-dir, steps.symcrypt.outputs.version) || '' }}

      # Windows searches System32 before PATH, and windows-latest has its own symcrypt.dll there, so
      # the run above may use that copy. A DLL next to the executable takes precedence over both, so
      # run the smoke test again that way to check the provisioned DLL itself.
      - name: Run the SymCrypt smoke test with the provisioned DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exeDir = 'ci/symcrypt-smoke/target/debug'
          Copy-Item (Join-Path $env:SYMCRYPT_LIB_PATH 'symcrypt.dll') $exeDir
          $env:SYMCRYPT_SMOKE_EXPECTED_LIBRARY = Join-Path (Resolve-Path $exeDir) 'symcrypt.dll'
          & (Join-Path $exeDir 'symcrypt-smoke.exe')
