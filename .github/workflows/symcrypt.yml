name: SymCrypt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # symcrypt with each opt-in feature, and ring alone, must compile for every target. The opt-ins may
  # pull their own crates (`rsa` does), but the symcrypt backend never uses them for protocol crypto.
  russh-symcrypt-features:
    name: russh (symcrypt feature combinations)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Check symcrypt with each opt-in feature
        shell: bash
        run: |
          for feature in async-trait des dsa flate2 rsa serde; do
            echo "::group::symcrypt,$feature"
            cargo check -p russh --all-targets --no-default-features --features "symcrypt,$feature"
            echo "::endgroup::"
          done

      - name: Check ring alone
        run: cargo check -p russh --all-targets --no-default-features --features ring

  smoke:
    name: SymCrypt smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The smoke crate is its own workspace, so its executable is built in ci/symcrypt-smoke/target.
      - name: Set up SymCrypt
        id: symcrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      # A second run must be a no-op that leaves the same environment behind.
      - name: Set up SymCrypt again
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      - name: Show SymCrypt location
        shell: bash
        env:
          SYMCRYPT_VERSION: ${{ steps.symcrypt.outputs.version }}
          SYMCRYPT_LIB_DIR: ${{ steps.symcrypt.outputs.lib-dir }}
        run: |
          echo "SymCrypt $SYMCRYPT_VERSION in $SYMCRYPT_LIB_DIR"
          dir="$SYMCRYPT_LIB_DIR"
          if command -v cygpath > /dev/null; then dir="$(cygpath --unix "$dir")"; fi
          ls -l "$dir"/*symcrypt*

      - name: Run the SymCrypt smoke test
        run: cargo run --manifest-path ci/symcrypt-smoke/Cargo.toml
        env:
          RUST_BACKTRACE: 1
          # The loader must pick the provisioned library: the packaged one on Linux, and on Windows the
          # copy next to the executable rather than C:\Windows\System32\symcrypt.dll.
          SYMCRYPT_SMOKE_EXPECTED_LIBRARY: ${{ runner.os == 'Windows' && format('{0}\ci\symcrypt-smoke\target\debug\symcrypt.dll', github.workspace) || format('{0}/libsymcrypt.so.{1}', steps.symcrypt.outputs.lib-dir, steps.symcrypt.outputs.version) }}

  # russh with SymCrypt as its only crypto backend, through its whole test suite. With this
  # backend, tests that use keys only incidentally load the ECDSA and RSA keys of
  # russh/tests/data/test-keys instead of generating Ed25519 keys, and checks of what SymCrypt
  # does not implement (Ed25519 signatures, DH group exchange, private key decryption) are
  # skipped.
  russh-symcrypt-only:
    name: russh (symcrypt only, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSH
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo mkdir -p /run/sshd

      # On Windows, put the pinned symcrypt.dll next to the test executables and
      # the examples (which `--all-targets` runs as tests) so they load it instead
      # of C:\Windows\System32\symcrypt.dll.
      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: |
            target/debug/deps
            target/debug/examples

      - name: Build
        run: cargo build -p russh --no-default-features --features symcrypt

      # Fails if the build depends on another crypto implementation or on rand/getrandom (see the
      # ban list in the script). Checks the host target, so Windows also covers pageant.
      - name: Check the dependency graph
        shell: bash
        run: ci/symcrypt-ban-check.sh

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy -p russh --no-default-features --features symcrypt -- -D warnings

      - name: Check the cipher benchmarks
        run: cargo check -p russh --no-default-features --features symcrypt,_bench --bench ciphers

      # Unit, integration and doc tests; the examples are only built.
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test -p russh --no-default-features --features symcrypt
        env:
          RUST_BACKTRACE: 1
          # Fail rather than skip the OpenSSH interop checks if sshd can't be started.
          RUSSH_REQUIRE_SSHD: "1"

      # `--all-targets` leaves out the doctests: rustdoc builds them in temporary directories, where
      # they would load the System32 symcrypt.dll. The OpenSSH interop checks need a Unix sshd, so
      # they are skipped.
      - name: Tests (without doctests)
        if: runner.os == 'Windows'
        run: cargo test -p russh --no-default-features --features symcrypt --all-targets
        env:
          RUST_BACKTRACE: 1
