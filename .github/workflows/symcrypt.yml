name: SymCrypt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # symcrypt with each opt-in feature (and the default algorithms), and ring alone, must compile for
  # every target. The opt-ins may pull their own crates (`rsa` does), but the symcrypt backend never
  # uses them for protocol crypto, except `ed25519-aws-lc`, which takes Ed25519 from aws-lc-rs
  # (`all-algorithms` only lets russh negotiate more of the algorithms SymCrypt implements). Clippy
  # then lints symcrypt with all the opt-ins (and the benchmarks) at once. rust.yml's Test-features
  # job runs the tests with symcrypt and all the opt-ins, and with ring.
  russh-symcrypt-features:
    name: russh (symcrypt feature combinations)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt

      - name: Check symcrypt with each opt-in feature
        shell: bash
        run: |
          for feature in async-trait des dsa ed25519-aws-lc flate2 rsa serde all-algorithms; do
            echo "::group::symcrypt,$feature"
            cargo check -p russh --all-targets --no-default-features --features "symcrypt,secure-algorithms,$feature"
            echo "::endgroup::"
          done

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy (symcrypt with all the opt-ins)
        run: cargo clippy -p russh --all-targets --no-default-features --features symcrypt,rsa,des,dsa,ed25519-aws-lc,flate2,serde,async-trait,all-algorithms,_bench -- -D warnings

      - name: Check ring alone
        run: cargo check -p russh --all-targets --no-default-features --features ring,secure-algorithms

  smoke:
    name: SymCrypt smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ubuntu:24.04
          - os: ubuntu-24.04-arm
            container: ubuntu:24.04
          - os: windows-latest
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' && startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.os == 'ubuntu-24.04-arm' && 'ARM64' || 'X64'))) || matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Linux job dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v4

      - name: Isolate Linux Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.91.0
        if: runner.os == 'Linux'

      # The smoke crate is its own workspace, so its executable is built in ci/symcrypt-smoke/target.
      - name: Set up SymCrypt
        id: symcrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      # A second run must be a no-op that leaves the same environment behind.
      - name: Set up SymCrypt again
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-smoke/target/debug

      - name: Show SymCrypt location
        shell: bash
        env:
          SYMCRYPT_VERSION: ${{ steps.symcrypt.outputs.version }}
          SYMCRYPT_LIB_DIR: ${{ steps.symcrypt.outputs.lib-dir }}
        run: |
          echo "SymCrypt $SYMCRYPT_VERSION in $SYMCRYPT_LIB_DIR"
          dir="$SYMCRYPT_LIB_DIR"
          if command -v cygpath > /dev/null; then dir="$(cygpath --unix "$dir")"; fi
          ls -l "$dir"/*symcrypt*

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --manifest-path ci/symcrypt-smoke/Cargo.toml --all-targets -- -D warnings

      - name: Run the SymCrypt smoke test
        run: cargo run --manifest-path ci/symcrypt-smoke/Cargo.toml
        env:
          RUST_BACKTRACE: 1
          # The loader must pick the provisioned library: the packaged one on Linux, and on Windows the
          # copy next to the executable rather than C:\Windows\System32\symcrypt.dll.
          SYMCRYPT_SMOKE_EXPECTED_LIBRARY: ${{ runner.os == 'Windows' && format('{0}\ci\symcrypt-smoke\target\debug\symcrypt.dll', github.workspace) || format('{0}/libsymcrypt.so.{1}', steps.symcrypt.outputs.lib-dir, steps.symcrypt.outputs.version) }}

  # russh with SymCrypt as its only crypto backend, through its whole test suite, with the default
  # algorithms (`secure-algorithms`). With this backend, tests that use keys only incidentally load
  # the ECDSA and RSA keys of russh/tests/data/test-keys instead of generating Ed25519 keys, and
  # checks of what SymCrypt does not implement (Ed25519 signatures, DH group exchange, private key
  # decryption) are skipped. On Linux, the sftp_server example also serves OpenSSH's sftp client.
  # The `ed25519-aws-lc` jobs do the same with Ed25519 from aws-lc-rs: the Ed25519 checks run,
  # including the OpenSSH interop of symcrypt_signatures.rs, and the ban check allows aws-lc-rs for
  # russh only.
  russh-symcrypt-only:
    name: russh (${{ matrix.features }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        features: ["symcrypt,secure-algorithms", "symcrypt,ed25519-aws-lc,secure-algorithms"]
        include:
          - os: ubuntu-24.04
            container: ubuntu:24.04
          - os: ubuntu-24.04-arm
            container: ubuntu:24.04
          - features: "symcrypt,ed25519-aws-lc,secure-algorithms"
            ban-check: --allow-aws-lc-ed25519
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' && startsWith(matrix.os, 'ubuntu-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","Linux","{0}","ubuntu2604"]', matrix.os == 'ubuntu-24.04-arm' && 'ARM64' || 'X64'))) || matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install Linux job dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git openssh-client openssh-server pkg-config
          mkdir -p /run/sshd

      - uses: actions/checkout@v4

      # aws-lc-sys assembles its x86-64 code with NASM on Windows (rust.yml's Build-Windows does the
      # same).
      - name: Install NASM
        if: runner.os == 'Windows' && contains(matrix.features, 'ed25519-aws-lc')
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Isolate Linux Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.91.0
        if: runner.os == 'Linux'

      # On Windows, put the pinned symcrypt.dll next to the test executables and
      # the examples (which `--all-targets` runs as tests) so they load it instead
      # of C:\Windows\System32\symcrypt.dll.
      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: |
            target/debug/deps
            target/debug/examples

      - name: Build
        run: cargo build -p russh --no-default-features --features "${{ matrix.features }}"

      # Fails if the build depends on another crypto implementation or on rand/getrandom (see the
      # ban list in the script). Checks the host target, so Windows also covers pageant.
      - name: Check the dependency graph
        shell: bash
        run: ci/symcrypt-ban-check.sh ${{ matrix.ban-check }} -p russh --no-default-features --features "${{ matrix.features }}"

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy -p russh --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings

      - name: Check the benchmarks
        run: cargo check -p russh --no-default-features --features "${{ matrix.features }},_bench" --benches

      # Unit, integration and doc tests; the examples are only built.
      - name: Tests
        if: runner.os == 'Linux'
        run: cargo test -p russh --no-default-features --features "${{ matrix.features }}"
        env:
          RUST_BACKTRACE: 1
          # Fail rather than skip the OpenSSH interop checks if sshd can't be started.
          RUSSH_REQUIRE_SSHD: "1"

      # One example end to end: sftp_server, whose host key comes from keys::generate_secret_key
      # (ECDSA P-256, generated by SymCrypt), serves OpenSSH's sftp client, which checks the host
      # key ssh-keyscan got and logs in with a P-256 user key.
      - name: Run the sftp_server example
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        env:
          PORT: "2222"
        run: |
          set -euo pipefail
          cargo build -p russh --no-default-features --features "${{ matrix.features }}" --example sftp_server
          dir="$RUNNER_TEMP/sftp-example"
          mkdir -p "$dir"
          ssh-keygen -q -t ecdsa -b 256 -N "" -f "$dir/id_ecdsa"
          target/debug/examples/sftp_server >"$dir/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; echo "--- sftp_server log (last lines)"; tail -n 100 "$dir/server.log"' EXIT
          for _ in $(seq 100); do
            ssh-keyscan -p "$PORT" -t ecdsa 127.0.0.1 >"$dir/known_hosts" 2>/dev/null || true
            [ -s "$dir/known_hosts" ] && break
            kill -0 "$server"
            sleep 0.2
          done
          cat "$dir/known_hosts"
          grep -q ' ecdsa-sha2-nistp256 ' "$dir/known_hosts"
          printf 'pwd\nls\n' >"$dir/batch"
          timeout 60 sftp -b "$dir/batch" -P "$PORT" -i "$dir/id_ecdsa" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o StrictHostKeyChecking=yes \
            test@127.0.0.1 | tee "$dir/sftp.out"
          grep -qw foo "$dir/sftp.out"
          grep -qw bar "$dir/sftp.out"

      # `--all-targets` leaves out the doctests, which the next step runs. The OpenSSH interop checks
      # need a Unix sshd, so they are skipped.
      - name: Tests (without doctests)
        if: runner.os == 'Windows'
        run: cargo test -p russh --no-default-features --features "${{ matrix.features }}" --all-targets
        env:
          RUST_BACKTRACE: 1

      # rustdoc builds the doctests in temporary directories, where they would load the System32
      # symcrypt.dll. Cargo hands the runner to rustdoc (`--test-runtool`), and the runner copies the
      # pinned DLL next to each doctest executable before running it. The `windows_doctest_dll`
      # doctest (russh/src/crypto/symcrypt/mod.rs) fails unless the loaded symcrypt.dll has the
      # contents of RUSSH_EXPECTED_SYMCRYPT_DLL, and `--nocapture` shows its path. With a runner,
      # rustdoc runs the merged doctests in one process, hence its "No rustdoc doctest environment
      # variable" warning.
      - name: Doctests
        if: runner.os == 'Windows'
        run: cargo test -p russh --no-default-features --features "${{ matrix.features }}" --doc -- --nocapture
        env:
          RUST_BACKTRACE: 1
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: pwsh -NoProfile -File ${{ github.workspace }}\ci\symcrypt-doctest-runner.ps1
          RUSSH_EXPECTED_SYMCRYPT_DLL: ${{ env.SYMCRYPT_DLL }}

  # A crate outside the workspace that depends on russh the way a downstream user does:
  # `default-features = false, features = ["symcrypt", ...]`, with only a few algorithm features
  # (and `ed25519-aws-lc` in the `ed25519-aws-lc` jobs), resolved from scratch (the lock file is not
  # committed). Its dependency graph must pass the ban check, it prints `Preferred::default()`, and
  # on Linux it runs a command on a stock OpenSSH server: with an ECDSA P-256 host key and an RSA
  # 3072 user key, or, with `ed25519-aws-lc`, with an Ed25519 host key (the server's only one) and
  # an Ed25519 user key.
  consumer:
    name: SymCrypt consumer (${{ matrix.variant }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        variant: [symcrypt, ed25519-aws-lc]
        include:
          - variant: symcrypt
            host-key: -t ecdsa -b 256
            host-key-algorithm: ecdsa-sha2-nistp256
            user-key: -t rsa -b 3072
          - variant: ed25519-aws-lc
            cargo-features: --features ed25519-aws-lc
            ban-check: --allow-aws-lc-ed25519
            host-key: -t ed25519
            host-key-algorithm: ssh-ed25519
            user-key: -t ed25519
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys assembles its x86-64 code with NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows' && matrix.variant == 'ed25519-aws-lc'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install OpenSSH
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo mkdir -p /run/sshd

      # The consumer crate is its own workspace, so its executable is built in
      # ci/symcrypt-consumer/target.
      - name: Set up SymCrypt
        uses: ./.github/actions/setup-symcrypt
        with:
          copy-dll-to: ci/symcrypt-consumer/target/debug

      - name: Check the dependency graph
        shell: bash
        run: ci/symcrypt-ban-check.sh ${{ matrix.ban-check }} --manifest-path ci/symcrypt-consumer/Cargo.toml -p symcrypt-consumer ${{ matrix.cargo-features }}

      - name: Install Clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --manifest-path ci/symcrypt-consumer/Cargo.toml --all-targets ${{ matrix.cargo-features }} -- -D warnings

      - name: Build
        run: cargo build --manifest-path ci/symcrypt-consumer/Cargo.toml ${{ matrix.cargo-features }}

      - name: Print the default algorithms
        run: cargo run --manifest-path ci/symcrypt-consumer/Cargo.toml ${{ matrix.cargo-features }}

      # An unprivileged sshd, which can only log in the user running it.
      - name: Run a command on a local OpenSSH server
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOST_KEY: ${{ matrix.host-key }}
          HOST_KEY_ALGORITHM: ${{ matrix.host-key-algorithm }}
          USER_KEY: ${{ matrix.user-key }}
        run: |
          dir="$RUNNER_TEMP/symcrypt-consumer-sshd"
          mkdir -p "$dir"
          # shellcheck disable=SC2086 # HOST_KEY and USER_KEY are ssh-keygen options.
          ssh-keygen -q $HOST_KEY -N "" -C "" -f "$dir/host_key"
          # shellcheck disable=SC2086
          ssh-keygen -q $USER_KEY -N "" -C "" -f "$dir/user_key"
          cp "$dir/user_key.pub" "$dir/authorized_keys"
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          cat > "$dir/sshd_config" <<EOF
          ListenAddress 127.0.0.1
          Port $port
          HostKey $dir/host_key
          AuthorizedKeysFile $dir/authorized_keys
          PidFile $dir/sshd.pid
          UsePAM no
          StrictModes no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          EOF
          trap 'if [ -f "$dir/sshd.pid" ]; then kill "$(cat "$dir/sshd.pid")" || true; fi; echo "----- sshd log -----"; cat "$dir/sshd.log" || true' EXIT
          ssh -V
          /usr/sbin/sshd -f "$dir/sshd_config" -E "$dir/sshd.log"
          for _ in $(seq 100); do
            if grep -q "Server listening" "$dir/sshd.log"; then break; fi
            sleep 0.1
          done
          status=0
          output="$(ci/symcrypt-consumer/target/debug/symcrypt-consumer 127.0.0.1 "$port" "$(id -un)" "$dir/user_key" "$dir/host_key.pub" echo hello 2>"$dir/consumer.err")" || status=$?
          cat "$dir/consumer.err"
          echo "output: $output"
          test "$status" -eq 0
          test "$output" = hello
          grep -q "host key $HOST_KEY_ALGORITHM," "$dir/consumer.err"
