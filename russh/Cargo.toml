[package]
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
description = "A client and server SSH library."
documentation = "https://docs.rs/russh"
edition = "2024"
homepage = "https://github.com/warp-tech/russh"
keywords = ["ssh"]
license = "Apache-2.0"
name = "russh"
readme = "../README.md"
repository = "https://github.com/warp-tech/russh"
version = "0.64.1"
rust-version = "1.89"

[features]
default = ["flate2", "aws-lc-rs", "rsa"]
# Crypto backends: enable at least one of `aws-lc-rs`, `ring` or `symcrypt`.
# If several are enabled, the first of `aws-lc-rs`, `ring`, `symcrypt` is used.
aws-lc-rs = ["dep:aws-lc-rs", "_rustcrypto"] # Default crypto backend.
async-trait = ["dep:async-trait"]
# Danger: 3DES cipher is insecure.
des = ["dep:des"]
# Danger: DSA algorithm is insecure.
dsa = ["ssh-key/dsa"]
ring = ["dep:ring", "_rustcrypto"] # Alternative crypto backend.
rsa = ["dep:rsa", "dep:pkcs1", "ssh-key/rsa"]
serde = ["ssh-key/serde"]
# Alternative crypto backend; links the native SymCrypt library (see the
# `symcrypt-sys` crate for how it is found, e.g. `SYMCRYPT_LIB_PATH`).
# It does not enable `_rustcrypto`: `ci/symcrypt-ban-check.sh` checks that
# this backend alone pulls in no other crypto implementation.
symcrypt = ["dep:symcrypt", "dep:symcrypt-sys", "dep:pkcs1", "pkcs1/alloc"]
# Private, enabled by the `aws-lc-rs` and `ring` backends: the pure-Rust
# crypto they use for every category but their AEADs (src/crypto/rustcrypto),
# `rand`, and the RustCrypto-based features of `pkcs8` and `ssh-key` (key
# generation and checks, encrypted and PPK keys).
_rustcrypto = [
  "dep:aes",
  "dep:block-padding",
  "dep:cbc",
  "dep:crypto-bigint",
  "dep:ctr",
  "dep:curve25519-dalek",
  "dep:ecdsa",
  "dep:ed25519-dalek",
  "dep:elliptic-curve",
  "dep:generic-array",
  "dep:getrandom",
  "dep:ghash",
  "dep:hmac",
  "dep:inout",
  "dep:keccak",
  "dep:md5",
  "dep:ml-kem",
  "dep:module-lattice",
  "dep:num-bigint",
  "dep:p256",
  "dep:p384",
  "dep:p521",
  "dep:pbkdf2",
  "dep:pkcs5",
  "dep:polyval",
  "dep:rand",
  "dep:salsa20",
  "dep:scrypt",
  "dep:sha1",
  "dep:sha2",
  "dep:sha3",
  "dep:typenum",
  "dep:universal-hash",
  "pkcs8/encryption",
  "ssh-key/ed25519",
  "ssh-key/encryption",
  "ssh-key/p256",
  "ssh-key/p384",
  "ssh-key/p521",
  "ssh-key/ppk",
  "ssh-key/sha1",
]
_bench = ["dep:criterion"]

[dependencies]
aes = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-lc-rs = { version = "1.16.2", optional = true }
bitflags = "2.0"
block-padding = { version = "0.4", optional = true }
byteorder.workspace = true
bytes.workspace = true
cbc = { version = "0.2", optional = true }
cipher = "0.5.1" # only pinned due to a cargo-minimal-versions failure in 0.5.0
ctr = { version = "0.10", optional = true }
curve25519-dalek = { version = "5", optional = true }
crypto-bigint = { version = "0.7.3", features = ["alloc"], optional = true }
data-encoding = "2.3"
delegate.workspace = true
digest.workspace = true
der = "0.8"
des = { version = "0.9", optional = true }
ecdsa = { version = "0.17", optional = true }
ed25519-dalek = { version = "3", features = ["alloc", "rand_core", "pkcs8"], optional = true }
elliptic-curve = { version = "0.14", features = ["ecdh"], optional = true }
enum_dispatch = "0.3.13"
flate2 = { version = "1.0.15", optional = true }
futures.workspace = true
generic-array = { version = "1.3.3", features = ["compat-0_14"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
ghash = { version = "0.6.0", optional = true } # only pinned due to a cargo-minimal-versions failure in 0.6.0-rc.3
hex-literal = "1"
hmac = { workspace = true, optional = true }
inout = { version = "0.2", optional = true }
keccak = { version = "0.2.0", optional = true }
log.workspace = true
md5 = { version = "0.8", optional = true }
ml-kem = { version = "0.3", optional = true }
module-lattice = { version = "0.2", optional = true }
num-bigint = { version = "0.5", features = ["rand_0_10"], optional = true }
p256 = { version = "0.14", features = ["ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdh"], optional = true }
p521 = { version = "0.14", features = ["ecdh"], optional = true }
pbkdf2 = { version = "0.13", optional = true }
pkcs1 = { version = "=0.8.0-rc.4", optional = true }
pkcs5 = { version = "0.8", optional = true }
pkcs8 = { version = "0.11", features = ["std"] }
polyval = { version = "0.7.1", optional = true } # only pinned due to a cargo-minimal-versions failure in 0.7.0
rand_core = { version = "0.10.0" }
rand = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
rsa = { version = "=0.10.0-rc.18", optional = true }
russh-cryptovec = { version = "0.62.0", path = "../cryptovec", features = [
  "ssh-encoding",
] }
russh-util = { version = "0.52.0", path = "../russh-util" }
salsa20 = { version = "0.11.0", optional = true }
scrypt = { version = "0.12.0", optional = true }
sec1 = { version = "0.8", features = ["der"] }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha3 = { version = "0.12.0", optional = true }
signature.workspace = true
spki = "0.8"
ssh-encoding.workspace = true
ssh-key.workspace = true
subtle = "2.4"
# symcrypt 0.6 (with `symcrypt::mlkem`) is not on crates.io yet.
# TODO: switch to crates.io once symcrypt >= 0.6 with mlkem is published.
symcrypt = { git = "https://github.com/microsoft/rust-symcrypt", rev = "7143e4c3bfe4e305b2518681c7752ae3d7b7ddbb", optional = true, features = ["sha1"] }
symcrypt-sys = { git = "https://github.com/microsoft/rust-symcrypt", rev = "7143e4c3bfe4e305b2518681c7752ae3d7b7ddbb", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
typenum = { version = "1.17", optional = true }
universal-hash = { version = "0.6.1", optional = true } # only pinned due to a cargo-minimal-versions failure in 0.6.0
zeroize = "1.7"
criterion = { version = "0.7", optional = true, features = ["html_reports"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = [
  "io-util",
  "rt-multi-thread",
  "time",
  "net",
] }

[target.'cfg(windows)'.dependencies]
pageant = { version = "0.2", path = "../pageant" }

[dev-dependencies]
anyhow = "1.0.4"
env_logger.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "rt-multi-thread",
  "time",
  "net",
  "sync",
  "macros",
  "process",
] }
rand.workspace = true
shell-escape = "0.1"
ratatui = "0.30"
tempfile = "3.14.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
russh-sftp = "2.3.0"
tokio.workspace = true
tokio-stream.workspace = true

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tokio-fd = "0.3"
termion = "4"

[package.metadata.docs.rs]
# Every public feature except `symcrypt`: docs.rs cannot build the native
# SymCrypt library, nor the git dependency it currently needs (see the TODO
# above `symcrypt`). The private `_bench` and `_rustcrypto` features are left
# out too (`aws-lc-rs` and `ring` enable `_rustcrypto`).
features = [
  "async-trait",
  "aws-lc-rs",
  "des",
  "dsa",
  "flate2",
  "ring",
  "rsa",
  "serde",
]

[[bench]]
name = "ciphers"
harness = false
