[workspace]
members = ["russh", "russh-config", "cryptovec", "pageant", "russh-util"]
resolver = "2"

[workspace.dependencies]
aes = "0.9"
async-trait = "0.1.50"
base16ct = "1"
byteorder = "1.4"
bytes = "1.7"
digest = "0.11.0"
delegate = "0.13"
env_logger = "0.11"
futures = "0.3"
hmac = "0.13"
log = "0.4.11"
rand = { version = "0.10", features = ["thread_rng"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
signature = "3"
ssh-encoding = { version = "0.3", features = ["bytes"] }
# ssh-key 0.7.0-rc.11 from a fork in which `sha2` is a default feature
# rather than a required dependency (cataggar/RustCrypto-SSH#2), so that the
# symcrypt backend alone doesn't depend on `sha2` (#27). Upstream made `sha2`
# required on purpose (RustCrypto/SSH#27); switch back to crates.io if a
# release makes it optional. Until then, as with the `symcrypt` git
# dependencies (#25), russh can't be published to crates.io. The `symcrypt`
# section of README.md shows this `git` and `rev`: keep them in sync.
# russh enables `sha2` and the algorithm, key encryption and PPK features of
# ssh-key only with the backends that use RustCrypto (its `_rustcrypto`
# feature), and `sha2` in its tests.
ssh-key = { git = "https://github.com/cataggar/RustCrypto-SSH", rev = "3c91f4bc8dfcf5820afd105bb166adf1e04a974e", version = "=0.7.0-rc.11", default-features = false, features = ["ecdsa", "rand_core", "std"] }
thiserror = "2.0.18"
tokio = { version = "1.17.0" }
tokio-stream = { version = "0.1.3", features = ["net", "sync"] }

